<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Neon Rush — Painel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: #020408;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 32px 16px;
  }

  .logo {
    font-family: 'Orbitron', sans-serif;
    font-size: 22px;
    font-weight: 900;
    color: #00f5ff;
    letter-spacing: 6px;
    text-shadow: 0 0 20px rgba(0,245,255,0.5);
    margin-bottom: 4px;
  }
  .logo-sub { font-size: 11px; color: rgba(0,245,255,0.4); letter-spacing: 4px; margin-bottom: 32px; }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(0,245,255,0.15);
    border-radius: 12px;
    padding: 28px;
    width: 100%;
    max-width: 560px;
    margin-bottom: 20px;
  }
  .card-title {
    font-family: 'Orbitron', sans-serif;
    font-size: 13px;
    color: #00f5ff;
    letter-spacing: 3px;
    margin-bottom: 20px;
  }

  input {
    width: 100%;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(0,245,255,0.2);
    border-radius: 8px;
    color: #fff;
    font-family: 'Share Tech Mono', monospace;
    font-size: 14px;
    padding: 10px 14px;
    margin-bottom: 12px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: rgba(0,245,255,0.6); }

  button {
    font-family: 'Orbitron', sans-serif;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 2px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    padding: 10px 20px;
    transition: opacity .2s;
  }
  button:hover { opacity: .8; }

  .btn-primary { background: linear-gradient(135deg,#00f5ff,#0088ff); color: #000; width: 100%; margin-top: 4px; }
  .btn-danger  { background: rgba(255,30,80,.15); color: #ff4466; border: 1px solid rgba(255,30,80,.3); padding: 6px 12px; font-size: 11px; }
  .btn-refresh { background: rgba(0,245,255,.1); color: #00f5ff; border: 1px solid rgba(0,245,255,.3); width: 100%; margin-top: 8px; }
  .btn-logout  { background: transparent; color: rgba(255,255,255,.3); border: 1px solid rgba(255,255,255,.1); margin-top: 8px; width: 100%; }

  .error-msg { color: #ff4466; font-size: 12px; margin-bottom: 10px; min-height: 16px; }
  .success-msg { color: #00ff88; font-size: 12px; margin-bottom: 10px; min-height: 16px; }

  .source-list { display: flex; flex-direction: column; gap: 10px; }
  .source-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 8px;
    padding: 10px 14px;
    gap: 10px;
  }
  .source-info { flex: 1; min-width: 0; }
  .source-name { font-size: 13px; color: #fff; font-weight: bold; }
  .source-url  { font-size: 11px; color: rgba(0,245,255,.5); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .source-empty { color: rgba(255,255,255,.3); font-size: 13px; text-align: center; padding: 20px; }

  .news-preview { display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
  .news-item {
    background: rgba(0,245,255,.05);
    border-left: 3px solid rgba(0,245,255,.3);
    padding: 8px 12px;
    font-size: 12px;
    color: rgba(255,255,255,.8);
    border-radius: 0 6px 6px 0;
  }
  .news-loading { color: rgba(255,255,255,.3); font-size: 12px; text-align: center; padding: 12px; }

  #loginSection  { display: flex; }
  #adminSection  { display: none; }
</style>
</head>
<body>

<div class="logo">NEON RUSH</div>
<div class="logo-sub">PAINEL ADMINISTRATIVO</div>

<!-- LOGIN -->
<div class="card" id="loginSection">
  <div class="card-title">🔐 LOGIN ADMIN</div>
  <input type="text"     id="loginUser" placeholder="Usuário admin" autocomplete="username">
  <input type="password" id="loginPass" placeholder="Senha" autocomplete="current-password">
  <div class="error-msg" id="loginErr"></div>
  <button class="btn-primary" onclick="doLogin()">▶ ENTRAR</button>
</div>

<!-- PAINEL ADMIN -->
<div id="adminSection">

  <!-- FONTES DE NOTÍCIAS -->
  <div class="card">
    <div class="card-title">📡 FONTES DE NOTÍCIAS</div>
    <input type="text" id="srcName" placeholder="Nome da fonte (ex: The Enemy)">
    <input type="url"  id="srcUrl"  placeholder="URL (ex: https://www.theenemy.com.br)">
    <div class="error-msg" id="addErr"></div>
    <div class="success-msg" id="addOk"></div>
    <button class="btn-primary" onclick="addSource()">＋ ADICIONAR FONTE</button>
    <button class="btn-refresh" onclick="refreshNews()">↺ FORÇAR ATUALIZAÇÃO DO TICKER</button>
  </div>

  <!-- LISTA DE FONTES -->
  <div class="card">
    <div class="card-title">📋 FONTES CADASTRADAS</div>
    <div class="source-list" id="sourceList">
      <div class="source-empty">Carregando...</div>
    </div>
  </div>

  <!-- PREVIEW DAS NOTÍCIAS -->
  <div class="card">
    <div class="card-title">🎮 PRÉVIA DO TICKER</div>
    <div class="news-preview" id="newsPreview">
      <div class="news-loading">Carregando notícias...</div>
    </div>
  </div>

  <div class="card" style="padding:16px">
    <button class="btn-logout" onclick="doLogout()">Sair da conta admin</button>
  </div>

</div>

<script>
const API = '';
let token = localStorage.getItem('admin_token');

if (token) showAdmin();

async function doLogin() {
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPass').value;
  document.getElementById('loginErr').textContent = '';

  try {
    const r = await fetch(API + '/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });
    const data = await r.json();
    if (!r.ok) return document.getElementById('loginErr').textContent = data.error;
    if (!data.user.is_admin) return document.getElementById('loginErr').textContent = 'Conta sem permissão de admin';

    token = data.token;
    localStorage.setItem('admin_token', token);
    showAdmin();
  } catch {
    document.getElementById('loginErr').textContent = 'Erro de conexão com o servidor';
  }
}

function showAdmin() {
  document.getElementById('loginSection').style.display = 'none';
  document.getElementById('adminSection').style.display = 'block';
  loadSources();
  loadNewsPreview();
}

function doLogout() {
  localStorage.removeItem('admin_token');
  token = null;
  document.getElementById('loginSection').style.display = 'flex';
  document.getElementById('adminSection').style.display = 'none';
}

async function loadSources() {
  const list = document.getElementById('sourceList');
  try {
    const r = await fetch(API + '/api/admin/news-sources', { headers: { Authorization: 'Bearer ' + token } });
    const rows = await r.json();
    if (!rows.length) {
      list.innerHTML = '<div class="source-empty">Nenhuma fonte cadastrada — usando fontes padrão</div>';
      return;
    }
    list.innerHTML = rows.map(s => `
      <div class="source-item">
        <div class="source-info">
          <div class="source-name">${s.name}</div>
          <div class="source-url">${s.url}</div>
        </div>
        <button class="btn-danger" onclick="deleteSource(${s.id})">✕ REMOVER</button>
      </div>
    `).join('');
  } catch {
    list.innerHTML = '<div class="source-empty">Erro ao carregar fontes</div>';
  }
}

async function addSource() {
  const name = document.getElementById('srcName').value.trim();
  const url  = document.getElementById('srcUrl').value.trim();
  document.getElementById('addErr').textContent = '';
  document.getElementById('addOk').textContent = '';

  const r = await fetch(API + '/api/admin/news-sources', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
    body: JSON.stringify({ name, url })
  });
  const data = await r.json();
  if (!r.ok) return document.getElementById('addErr').textContent = data.error;

  document.getElementById('addOk').textContent = '✔ Fonte adicionada com sucesso!';
  document.getElementById('srcName').value = '';
  document.getElementById('srcUrl').value  = '';
  loadSources();
}

async function deleteSource(id) {
  await fetch(API + '/api/admin/news-sources/' + id, {
    method: 'DELETE',
    headers: { Authorization: 'Bearer ' + token }
  });
  loadSources();
}

async function refreshNews() {
  const preview = document.getElementById('newsPreview');
  preview.innerHTML = '<div class="news-loading">Buscando notícias... aguarde</div>';
  try {
    const r = await fetch(API + '/api/admin/news-sources/refresh', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + token }
    });
    const data = await r.json();
    if (!data.ok) {
      const diag = (data.diagnostics || []).map(d =>
        `<div class="news-item" style="border-left-color:${d.ok?'#00ff88':'#ff4466'}">
          ${d.ok ? '✔' : '✕'} ${d.url}<br>
          <span style="font-size:11px;opacity:.6">${d.ok ? d.count + ' títulos encontrados' : d.error}</span>
        </div>`
      ).join('');
      preview.innerHTML = `<div class="news-item" style="border-left-color:#ff4466">⚠ Não foi possível extrair notícias deste site. Tente outro site de notícias de games (ex: theenemy.com.br)</div>${diag}`;
      return;
    }
    loadNewsPreview(data.news);
  } catch {
    preview.innerHTML = '<div class="news-loading" style="color:#ff4466">Erro de conexão</div>';
  }
}

async function loadNewsPreview(news) {
  const preview = document.getElementById('newsPreview');
  if (!news) {
    const r = await fetch(API + '/api/gamenews');
    const data = await r.json();
    news = data.news;
  }
  if (!news || !news.length) {
    preview.innerHTML = '<div class="news-loading">Sem notícias no momento</div>';
    return;
  }
  preview.innerHTML = news.map(n => `<div class="news-item">${n.title}</div>`).join('');
}

document.getElementById('loginPass').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });
</script>
</body>
</html>
